name: CodeXen Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Counts, frontmatter, permissions (.md vs opencode.json), handoff rule and
      # docs/version consistency are all checked dynamically by validate.sh
      - name: Run validation script
        run: bash scripts/validate.sh

      - name: Test install/update scripts (sandbox HOME)
        run: bash tests/test-install.sh

      - name: Test context-monitor plugin (OpenCode v1 + v2 adapters)
        run: |
          (cd core/.opencode && npm install --no-audit --no-fund)
          node tests/test-context-monitor.mts
