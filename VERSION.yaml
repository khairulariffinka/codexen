version: 0.6.0
name: CodeXen
description: Customizable AI coding agent framework for OpenCode with persistent memory, parallel subagent execution, self-healing orchestration, and BRS/SRS/SDS specification chain
author: khairulariffinka
license: MIT
default_agent: codexen
topics:
  - ai-agent
  - opencode
  - coding-assistant
  - memory-system
  - subagent
  - parallel-execution
  - self-healing
  - token-budgeting
  - guardrails
  - ci-cd
  - opencode-compatibility-refactor
  - agentic-ai
  - brs
  - srs
  - sds

core_agents:
  - codexen
  - memory
  - planner
  - research
  - coder
  - auditor
  - security
  - backend-coder
  - frontend-coder
  - test-coder
  - refactor-expert
  - devops-coder
  - security-auditor
  - performance-auditor
  - style-auditor
  - git-manager
  - docs-manager
  - decision-log
  - database-expert
  - api-designer
  - doc-scout
  - brs-manager
  - srs-manager
  - sds-manager

core_skills:
  - orchestration
  - planner
  - research
  - coder
  - auditor
  - memory
  - security
  - decision-log
  - brs
  - srs
  - sds
  - modes
  - output
  - greeting

template_skills:
  - setup-profile
  - init-project
  - switch-config

features:
  - lessons-learned
  - token-budgeting
  - feedback-loop
  - parallel-validation
  - ci-cd-validation
  - guardrails

paths:
  opencode_config: ~/.config/opencode
  opencode_agents: ~/.config/opencode/agents
  opencode_skills: ~/.config/opencode/skills
  opencode_scripts: ~/.config/opencode/scripts

install:
  copy_core_agents: true
  copy_core_skills: true
  copy_primary_agent: true
  copy_scripts: true

update:
  preserve_user_agents: true
  preserve_user_skills: true
  update_core: true
  auto_backup: true
  conflict_resolution: true
  merge_opencode_json: true
