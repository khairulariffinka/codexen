  - parallel-execution
  - self-healing
  - token-budgeting
  - guardrails
  - ci-cd
  - opencode-compatibility-refactor
  - agentic-ai
  - brs
  - srs
  - sds

core_agents:
  - codexen
  - memory
  - planner
  - research
  - coder
  - auditor
  - security
  - backend-coder
  - frontend-coder
  - test-coder
