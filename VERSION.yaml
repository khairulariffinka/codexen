  - devops-coder
  - security-auditor
  - performance-auditor
  - style-auditor
  - git-manager
  - docs-manager
  - decision-log
  - database-expert
  - api-designer
  - doc-scout
  - brs-manager
  - srs-manager
  - sds-manager

core_skills:
  - orchestration
  - planner
  - research
  - coder
  - auditor
  - memory
  - security
  - decision-log
  - brs
  - srs
  - sds
  - modes
  - output
  - greeting

core_commands:
  - audit
  - test
  - lint
  - review
  - plan
  - brs
  - srs
  - sds
  - commit
  - refactor
  - init-codexen
  - docker

template_skills:
  - setup-profile
  - init-project
  - model-picker

features:
  - lessons-learned
  - token-budgeting
  - feedback-loop
  - parallel-validation
  - ci-cd-validation
  - guardrails
  - custom-commands
  - lsp-integration
  - auto-formatters
  - compaction
  - model-optimization
  - smart-recall
  - priority-scoring
  - agent-performance-tracking
  - goal-stop-condition
  - dream-distill
  - auto-checkpoint

paths:
  opencode_config: ~/.config/opencode
  opencode_agents: ~/.config/opencode/agents
  opencode_skills: ~/.config/opencode/skills
  opencode_commands: ~/.config/opencode/commands
  opencode_scripts: ~/.config/opencode/scripts

install:
  copy_core_agents: true
  copy_core_skills: true
  copy_core_commands: true
  copy_primary_agent: true
  copy_scripts: true

update:
  preserve_user_agents: true
  preserve_user_skills: true
  update_core: true
  auto_backup: true
  conflict_resolution: true
  merge_opencode_json: true
